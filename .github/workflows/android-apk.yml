name: Build Fitness Pro Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Capacitor
        run: npm install
      - name: Prepare app assets
        run: |
          mkdir -p www
          cp index.html supabase-config.js manifest.webmanifest sw.js icon.svg www/
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitness-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Fitness Pro Android - Build ${{ github.run_number }}
          body: APK Android installable de Fitness Pro.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
